<!DOCTYPE html>
<html lang="en">

<title>GD Plist Generator</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:16px 20px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{margin:0;font-size:22px;flex:1}
header button{width:auto;margin:0;padding:8px 12px}
main{display:grid;grid-template-columns:330px 1fr;gap:16px;padding:12px 20px 24px}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card h2{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.drop{display:block;border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;margin-bottom:8px;font-size:14px}
.drop b{display:block}.drop span{color:var(--muted);font-size:12px;word-break:break-all}
input[type=file]{display:none}

button.alt{background:transparent;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:6px;margin:8px 0}.tools button{margin:0;padding:9px 4px;flex:1}
.status{font-size:13px;color:var(--muted);margin-top:10px}.status.err{color:var(--accent)}
#panel{display:none;border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13px}
#info{color:var(--muted);margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.two label{font-size:12px;color:var(--muted)}
#pad{display:none;grid-template-columns:repeat(3,48px);gap:4px;justify-content:center;margin:8px 0}#pad button{margin:0;padding:8px}
#stepl{text-align:center;color:var(--muted);font-size:12px}
.view{touch-action:pan-x pan-y;overflow:auto;height:75vh;display:flex;border-radius:8px;background:#000;position:relative;min-height:240px}
canvas{display:block;margin:auto;flex:none;image-rendering:pixelated}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;text-align:center;padding:20px}
#tip{position:fixed;pointer-events:none;background:#000c;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(420px,100%);max-height:85vh;overflow:auto;position:relative;text-align:center}
.box .x{position:absolute;top:8px;right:12px;font-size:22px;cursor:pointer}
.kr{display:flex;align-items:center;gap:8px;margin:6px 0;text-align:left;font-size:14px}.kr span{flex:1}.zb{width:auto;margin:0;padding:4px 12px;text-transform:none;letter-spacing:0}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mm-off{background:#e5322d!important;color:#fff!important;border-color:#e5322d!important}.mm-on{background:#2b6fe6!important;color:#fff!important;border-color:#2b6fe6!important}
#bEye.hid{opacity:.35}
.sw{appearance:none;-webkit-appearance:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;margin:0;flex:none;border:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.sw:checked{background:var(--accent)}.sw:checked::after{left:21px}
.drop{position:relative}
.infoBtn{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;padding:0;margin:0;border:1.5px solid var(--muted);background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}

.pkRow{display:flex;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}.pkRow span{flex:1;text-align:left;word-break:break-all}.pkRow button{width:auto;padding:6px 10px}
#bCmp.dot::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:#e5484d}

<script>
/* mini zip: makes and reads .zip files without any internet */
(function(){
  const T=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;T[i]=c>>>0}
  const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=T[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0};
  const enc=new TextEncoder(),dec=new TextDecoder();
  const toU8=async d=>d instanceof Uint8Array?d:typeof d==='string'?enc.encode(d):new Uint8Array(await d.arrayBuffer());
  async function inflate(u8){const ds=new DecompressionStream('deflate-raw'),w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
  function MiniZip(){this._f=[]}
  MiniZip.prototype.file=function(name,data){this._f.push({name:String(name).replace(/^\/+/,''),data});return this};
  MiniZip.prototype.generateAsync=async function(){
    const d=new Date(),tm=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),dt=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
    const parts=[],cen=[];let off=0;
    for(const f of this._f){
      const n=enc.encode(f.name),u=await toU8(f.data),c=crc(u);
      const lh=new DataView(new ArrayBuffer(30));
      lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,tm,true);lh.setUint16(12,dt,true);
      lh.setUint32(14,c,true);lh.setUint32(18,u.length,true);lh.setUint32(22,u.length,true);lh.setUint16(26,n.length,true);lh.setUint16(28,0,true);
      parts.push(new Uint8Array(lh.buffer),n,u);
      const ch=new DataView(new ArrayBuffer(46));
      ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,tm,true);ch.setUint16(14,dt,true);
      ch.setUint32(16,c,true);ch.setUint32(20,u.length,true);ch.setUint32(24,u.length,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
      cen.push(new Uint8Array(ch.buffer),n);
      off+=30+n.length+u.length;
    }
    let cs=0;cen.forEach(p=>cs+=p.length);
    const e=new DataView(new ArrayBuffer(22));
    e.setUint32(0,0x06054b50,true);e.setUint16(8,this._f.length,true);e.setUint16(10,this._f.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
    return new Blob([...parts,...cen,new Uint8Array(e.buffer)],{type:'application/zip'});
  };
  MiniZip.loadAsync=async function(file){
    const u=new Uint8Array(await file.arrayBuffer()),v=new DataView(u.buffer,u.byteOffset,u.byteLength);
    let e=-1;for(let i=u.length-22;i>=Math.max(0,u.length-65558);i--)if(v.getUint32(i,true)===0x06054b50){e=i;break}
    if(e<0)throw new Error('This is not a zip file.');
    const cnt=v.getUint16(e+10,true);let p=v.getUint32(e+16,true);const files={};
    for(let k=0;k<cnt;k++){
      if(v.getUint32(p,true)!==0x02014b50)throw new Error('The zip file is damaged.');
      const meth=v.getUint16(p+10,true),cs=v.getUint32(p+20,true),nl=v.getUint16(p+28,true),xl=v.getUint16(p+30,true),cl=v.getUint16(p+32,true),lo=v.getUint32(p+42,true);
      const name=dec.decode(u.subarray(p+46,p+46+nl));p+=46+nl+xl+cl;
      files[name]={name,dir:name.endsWith('/'),async:async type=>{
        const ln=v.getUint16(lo+26,true),lx=v.getUint16(lo+28,true),s=lo+30+ln+lx,raw=u.subarray(s,s+cs);
        let out;if(meth===0)out=raw;else if(meth===8)out=await inflate(raw);else throw new Error('This zip uses a type I cannot read.');
        return type==='string'?dec.decode(out):type==='blob'?new Blob([out]):out;
      }};
    }
    return {files};
  };
  window.JSZip=MiniZip;
})();
</script>

<script>
const $=id=>document.getElementById(id),cv=$('cv'),ctx=cv.getContext('2d');
let sheet=null,sc=null,xdoc=null,fd=null,frames=[],sel=-1,drag=null,fname='edited.plist',hist=[],redo=[],step=1,bind=null,ob=null,multi=false,ms=new Set();
var cfg={auto:20,red:'#ff0000',bg:'#000000',hs:9,snap:true,gs:true,gd:8,gg:0,names:false,fps:8,dark:null};try{Object.assign(cfg,JSON.parse(localStorage.getItem('gdcfg')||'{}'))}catch(e){}
const sn=v=>cfg.snap?Math.round(v):Math.round(v*2)/2;
const nums=s=>(String(s).match(/-?\d+(\.\d+)?/g)||[]).map(Number);
const fmt=n=>String(Math.round(n*10)/10);
const pairs=d=>{const c=[...d.children],m={};for(let i=0;i<c.length;i+=2)m[c[i].textContent]=c[i+1];return m};
const snap=()=>frames.map(f=>({...f}));
const status=(m,e)=>{const s=$('st');s.textContent=m;s.className='status'+(e?' err':'')};

let origText='',origNames=[],origSig=null;
function load(txt){
  const d=new DOMParser().parseFromString(txt,'text/xml');
  if(d.querySelector('parsererror'))throw new Error('Invalid plist XML');
  const root=d.querySelector('plist > dict'),rp=root&&pairs(root);
  if(!rp||!rp.frames)throw new Error('No "frames" key in plist');
  const c=[...rp.frames.children],out=[];origText=txt;origNames=[];for(let i=0;i<c.length;i+=2)origNames.push(c[i].textContent);
  for(let i=0;i<c.length;i+=2){
    const m=pairs(c[i+1]),rk=m.textureRect?'textureRect':'frame';
    if(!m[rk])continue;
    const r=nums(m[rk].textContent);if(r.length<4)continue;
    const ok=m.spriteOffset?'spriteOffset':'offset',off=m[ok]?nums(m[ok].textContent):[0,0];
    const rot=!!(m.textureRotated?m.textureRotated.tagName==='true':m.rotated&&m.rotated.tagName==='true');
    const ss=m.spriteSize?nums(m.spriteSize.textContent):null,ssd=!!(ss&&ss.length>1&&(ss[0]!==r[2]||ss[1]!==r[3]));
    out.push({name:c[i].textContent,el:c[i+1],rk,ok,rot,ssd,ss0:ss,sm:[r[2],r[3]],x:r[0],y:r[1],w:rot?r[3]:r[2],h:rot?r[2]:r[3],ox:off[0]||0,oy:off[1]||0});
  }
  if(!out.length)throw new Error('No frames found');
  xdoc=d;fd=rp.frames;frames=out;sel=-1;hist=[];redo=[];out.forEach(f=>f.o={x:f.x,y:f.y,w:f.w,h:f.h,rot:f.rot,ox:f.ox,oy:f.oy,name:f.name});
}
function commitAll(){
  for(const f of frames){
    const m=pairs(f.el),rw=f.rot?f.h:f.w,rh=f.rot?f.w:f.h;
    m[f.rk].textContent='{{'+f.x+','+f.y+'},{'+rw+','+rh+'}}';
    if(m.spriteSize)m.spriteSize.textContent='{'+rw+','+rh+'}';
    if(m[f.ok])m[f.ok].textContent='{'+fmt(f.ox)+','+fmt(f.oy)+'}';
    const rk=m.textureRotated?'textureRotated':m.rotated?'rotated':null;
    if(rk){if((m[rk].tagName==='true')!==f.rot)m[rk].replaceWith(xdoc.createElement(f.rot?'true':'false'))}
    else if(f.rot){const k=xdoc.createElement('key');k.textContent='textureRotated';f.el.append(k,xdoc.createElement('true'))}
  }
}
function serialize(){

function cmd(q){
  let m;
  if(/^undo$/i.test(q))return{text:'Undo the last step.',fn:undo};
  if(/^redo$/i.test(q))return{text:'Redo the step.',fn:redoIt};
  if(/^zoom in$/i.test(q))return{text:'Zoom in.',fn:()=>setZoom(+$('zoom').value*1.25)};
  if(/^zoom out$/i.test(q))return{text:'Zoom out.',fn:()=>setZoom(+$('zoom').value/1.25)};
  if(!/^(hide|show|delete|remove|copy|duplicate|rotate|add|select|move|rename|resize|set offset)/i.test(q))return null;
  if(!frames.length||!sheet)return{text:'Load an image and a plist first.'};
  const sl=()=>tgts().length?null:{text:'Select a group first.'};
  if(/^(hide|show)( selected)?$/i.test(q))return sl()||{text:'Hide or show the selected group.',fn:()=>$('bEye').click()};
  if(/^(delete|remove)( selected)?$/i.test(q))return sl()||{text:'Delete the selected group.',fn:del};
  if(/^(copy|duplicate)( selected)?$/i.test(q))return sl()||{text:'Copy the selected group.',fn:copy};
  if(/^add( a)?( new)? group$/i.test(q))return{text:'Add a new 32x32 group at the top left.',fn:add};
  if(/^rotate( selected)?$/i.test(q))return sl()||{text:'Rotate the selected group 90 degrees. This changes the image too, so download both files.',fn:rotate};
  if(m=q.match(/^select (.+)$/i)){const i=find(m[1]);return i<0?miss(m[1]):{text:'Select '+frames[i].name+'.',fn:()=>select(i)}}
  if(m=q.match(/^(?:delete|remove) group (\d+)$/i)){const i=+m[1]-1;return frames[i]?{text:'Delete group '+m[1]+' ('+frames[i].name+').',fn:()=>{const b=snap();frames.splice(i,1);ms.clear();sel=-1;push(b);list();panel();draw()}}:{text:'There is no group '+m[1]+'. You have '+frames.length+' groups.'}}
  if(m=q.match(/^move (all|selected|.+?) (\d+) ?(?:px|pixels?)? ?(left|right|up|down)$/i)){
    const w=m[1].toLowerCase(),ix=w==='all'?frames.map((_,i)=>i):w==='selected'?tgts():[find(m[1])];
    if(!ix.length||ix[0]<0)return w==='selected'?{text:'Select a group first.'}:miss(m[1]);
    const k=+m[2],d=m[3].toLowerCase(),dx=d==='left'?-k:d==='right'?k:0,dy=d==='up'?-k:d==='down'?k:0;
    return{text:'Move '+(w==='all'?'all '+ix.length+' groups':ix.length+' group(s)')+' '+k+' px '+d+'.',fn:()=>{const b=snap();ix.forEach(i=>{const f=frames[i];f.x=Math.round(Math.min(Math.max(0,f.x+dx),sheet.width-f.w));f.y=Math.round(Math.min(Math.max(0,f.y+dy),sheet.height-f.h))});push(b);panel();draw()}}}
  if(m=q.match(/^rename all to (.+)$/i)){const base=m[1].trim();return{text:'Rename all groups to '+base+'_1, '+base+'_2, ...',fn:()=>{const b=snap();frames.forEach((f,i)=>f.name=base+'_'+(i+1)+'.png');push(b);list();panel();draw()}}}

    if(f.name!==o.name){R.n.ren++;R.P.push({i,k:1,t:'"'+o.name+'" was renamed to "'+f.name+'". The game looks for the old name, so the sprite may vanish. Fix: rename it back to "'+o.name+'".'})}

    if(f.ox!==o.ox||f.oy!==o.oy)R.n.offset++;
    if(f.rot!==o.rot){R.n.rot++;R.P.push({i,k:0,t:'"'+f.name+'" rotation changed ('+(o.rot?'rotated':'upright')+' to '+(f.rot?'rotated':'upright')+'). Fix: if it was not on purpose, tap Rotate again or use Revert group.'})}
    if(sheet&&(f.x!==o.x||f.y!==o.y||f.w!==o.w||f.h!==o.h)){if(f.x<0||f.y<0||f.x+f.w>sheet.width||f.y+f.h>sheet.height)R.P.push({i,k:1,t:'"'+f.name+'" now goes outside the image. Fix: move it inside the image or resize it.'})}
  });
  const gone=origNames.filter(n=>!frames.some(f=>f.o&&f.o.name===n));R.n.del=gone.length;
  if(gone.length)R.P.push({i:-1,k:1,t:gone.length+' group(s) from the original are missing: '+gone.slice(0,5).join(', ')+(gone.length>5?' and '+(gone.length-5)+' more':'')+'. The game may show nothing for them. Fix: undo the delete, or add groups with those names.'});
  if(sheet&&origSig){
    if(sheet.width!==origSig.w||sheet.height!==origSig.h)R.P.push({i:-1,k:1,t:'The image is now '+sheet.width+'x'+sheet.height+', it was '+origSig.w+'x'+origSig.h+'. The boxes will not match the pixels. Fix: use the original image size, or scale the boxes to match.'});

function preTest(){
  const er=[],wr=[],nm2={};
  frames.forEach((f,i)=>{
    const sz=srcSize(f),rw=f.rot?f.h:f.w,rh=f.rot?f.w:f.h;
    if(f.w<=0||f.h<=0)er.push([i,f.name+' has size 0']);
    if(sheet&&(f.x<0||f.y<0||f.x+f.w>sheet.width||f.y+f.h>sheet.height))er.push([i,f.name+' goes outside the image']);
    (nm2[f.name]=nm2[f.name]||[]).push(i);
    if(f.rot)wr.push([i,f.name+' is rotated']);
    if([f.x,f.y,f.w,f.h].some(v=>v%1))wr.push([i,f.name+' has decimal numbers']);
    if(Math.abs(f.ox)>(sz[0]-rw)/2+.5||Math.abs(f.oy)>(sz[1]-rh)/2+.5)wr.push([i,f.name+' sticks out of its original size']);
    if(!/\.png$/i.test(f.name))wr.push([i,f.name+' has no .png ending']);
    if(f.ssd)wr.push([i,f.name+': spriteSize is '+f.ss0[0]+'x'+f.ss0[1]+' but textureRect is '+f.sm[0]+'x'+f.sm[1]+'. The game uses spriteSize. Download writes both the same.']);
  });
  for(const n in nm2)if(nm2[n].length>1)er.push([nm2[n][1],n+' is used '+nm2[n].length+' times']);
  for(let a=0;a<frames.length&&er.length<30;a++)for(let b=a+1;b<frames.length;b++){const p=frames[a],q=frames[b];if(p.x<q.x+q.w&&q.x<p.x+p.w&&p.y<q.y+q.h&&q.y<p.y+p.h)er.push([a,p.name+' overlaps '+q.name])}
  const root=xdoc&&xdoc.querySelector('plist > dict'),rp=root&&pairs(root),md=rp&&rp.metadata&&pairs(rp.metadata),sz2=md&&md.size?nums(md.size.textContent):null;
  if(sz2&&sz2.length>1&&sheet&&(sz2[0]!==sheet.width||sz2[1]!==sheet.height))er.unshift([-1,'The plist says the sheet is '+sz2[0]+'x'+sz2[1]+' but the image is '+sheet.width+'x'+sheet.height]);
  const pick=[...er,...wr].filter(x=>x[0]>=0).slice(0,8);
  modal('<span class="x" id="mx">×</span><h3>Pre-test check</h3>'+
    (er.length?'<p><b>Fix these first ('+er.length+'):</b></p>'+er.slice(0,8).map(x=>'<p>• '+esc(x[1])+'</p>').join(''):'<p><b>No errors found. Ready to test.</b></p>')+
    (wr.length?'<p><b>Test these first ('+wr.length+'):</b></p>'+wr.slice(0,8).map(x=>'<p>• '+esc(x[1])+'</p>').join(''):'')+
    pick.map(x=>'<button class="alt" data-p="'+x[0]+'">Select '+esc(frames[x[0]].name)+'</button>').join('')+
    '<p style="font-size:12px;opacity:.6">This checks the standard plist rules. The game may differ a little.</p>');
  $('mx').onclick=closeM;
  document.querySelectorAll('#mb [data-p]').forEach(b=>b.onclick=()=>{closeM();select(+b.dataset.p)});
}

}
$('bNext').onclick=()=>stepGroup(-1);$('bPrev').onclick=()=>stepGroup(1);
const ACTS=[['rot','Rotate 90°',rotate],['undo','Undo <[',undo],['redo','Redo ]>',redoIt],['add','Add group +',add],['copy','Copy group 🔄',copy],['del','Delete group ♻️',del],['s1','+1 pixel',()=>setStep(1)],['s5','+5 pixel',()=>setStep(5)],['s10','+10 pixel',()=>setStep(10)],['sc','+ custom pixel',()=>setStep(parseFloat($('cs').value))],['up','Move up ⬆️',DIR.up],['left','Move left ⬅️',DIR.left],['right','Move right ➡️',DIR.right],['down','Move down ⬇️',DIR.down],['zin','Zoom in +',()=>setZoom(+$('zoom').value*1.25)],['zout','Zoom out −',()=>setZoom(+$('zoom').value/1.25)],['multi','Multi select mode 🖲',()=>setMulti(!multi)],['eye','Hide or show group 👁',()=>$('bEye').click()],['rev','Revert group',()=>$('bRev').click()],['pre','Pre-test check',()=>$('bPre').click()],['anim','Animation preview',()=>$('gAn').click()],['gzin','Game preview zoom in',()=>$('gIn').click()],['gzout','Game preview zoom out',()=>$('gOut').click()],['msave','Manual saves',()=>$('bSave').click()],['sett','Settings',()=>$('bSet').click()],['helper','Offline helper',()=>$('bOff').click()],['next','Next group (up)',()=>stepGroup(-1)],['prev','Previous group (down)',()=>stepGroup(1)]];
let keys={};try{keys=JSON.parse(localStorage.getItem('gdkeys')||'{}')}catch(e){}
const modal=h=>{$('mb').innerHTML=h;$('modal').style.display='flex';iconify($('mb'))};
const closeM=()=>{$('modal').style.display='none';bind=null};
const nm=a=>ACTS.find(x=>x[0]===a)[1];
const kn=k=>k===' '?'Space':/^tap:/.test(k)?k.slice(4)+'× tap':k;
function dups(){const g={};for(const a in keys)(g[keys[a]]=g[keys[a]]||[]).push(a);return Object.values(g).filter(v=>v.length>1).flat()}
function keysBox(){
  bind=null;updTap();
  modal('<span class="x" id="mx">×</span><h3>⌨️ Keybinds</h3>'+ACTS.map(a=>'<div class="kr"><span>'+a[1]+'</span><button class="alt" data-a="'+a[0]+'">'+(keys[a[0]]?kn(keys[a[0]])+' +':'+ key')+'</button></div>').join(''));
  $('mx').onclick=closeM;
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>ask(b.dataset.a,false));
}
function ask(a,warn){
  bind={a,warn};
  const used=Object.values(keys),free=[...'abcdefghijklmnopqrstuvwxyz0123456789'].find(c=>!used.includes(c));
  modal((warn?'':'<span class="x" id="mx">×</span>')+'<h3>press a key</h3>'+(warn?'<p>change to <b>'+free+'</b></p>':'')+'<button class="alt" id="mk">Mobile keybinds</button>');
  if(!warn)$('mx').onclick=keysBox;
  $('mk').onclick=()=>askTap(a,warn);
}
function askTap(a,warn){
  bind={a,warn,tap:1};
  const used=Object.values(keys);let free=1;while(used.includes('tap:'+free))free++;
  modal((warn?'':'<span class="x" id="mx">×</span>')+'<h3>&lt;insert number&gt; click</h3>'+(warn?'<p>change to <b>'+free+'</b></p>':'')+'<input type="number" id="tn" min="1" max="28" value="2" style="width:90px;text-align:center"><button id="tok">Set</button><p id="tm" style="color:var(--accent);margin:8px 0 0"></p>');
  if(!warn)$('mx').onclick=()=>ask(a,false);
  $('tok').onclick=()=>{const n=Math.round(+$('tn').value);if(!(n>=1&&n<=28)){$('tm').textContent='Enter a number from 1 to 28.';return}setTapKey(a,n)};
}
function setTapKey(a,n){
  keys[a]='tap:'+n;
  try{localStorage.setItem('gdkeys',JSON.stringify(keys))}catch(x){}
  const d=dups();d.length?warnBox(d):keysBox();
}
let tapN=0,tapT=null;
function updTap(){const on=Object.values(keys).some(v=>/^tap:/.test(v))?'block':'none';$('tapBtn').style.display=on;$('tapEnter').style.display=on}
function tapLbl(){$('tapBtn').innerHTML='👆 tap'+(tapN?' ('+tapN+')':'');iconify($('tapBtn'))}
$('tapBtn').onclick=()=>{tapN++;clearTimeout(tapT);tapT=setTimeout(()=>{tapN=0;tapLbl()},8000);tapLbl()};
$('tapEnter').onclick=()=>{clearTimeout(tapT);const n=tapN;tapN=0;tapLbl();const bad=dups(),a=ACTS.find(x=>keys[x[0]]==='tap:'+n&&!bad.includes(x[0]));if(a)a[2]()};
updTap();
function warnBox(d){
  bind=null;updTap();
  modal('<h3>Warning</h3><p>There was a duplicate keybind, you need to change one.</p>'+d.map(a=>'<button class="alt" data-w="'+a+'">'+nm(a)+'</button>').join(''));
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>ask(b.dataset.w,true));
}
$('bKeys').onclick=keysBox;
$('modal').onclick=e=>{if(e.target.id==='modal'&&!bind&&!$('mb').querySelector('[data-w]'))closeM()};
document.addEventListener('keydown',e=>{
  if(bind&&bind.tap)return;
  if(bind){
    e.preventDefault();if(['Shift','Control','Alt','Meta'].includes(e.key))return;
    keys[bind.a]=e.key.length===1?e.key.toLowerCase():e.key;
    try{localStorage.setItem('gdkeys',JSON.stringify(keys))}catch(x){}
    const d=dups();d.length?warnBox(d):keysBox();return;
  }
  if($('modal').style.display==='flex'||/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))return;
  const k=e.key.length===1?e.key.toLowerCase():e.key,bad=dups();
  const a=ACTS.find(x=>keys[x[0]]===k&&!bad.includes(x[0]));
  if(a){e.preventDefault();a[2]()}
});

/* autosave */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('gdplist',1);r.onupgradeneeded=()=>r.result.createObjectStore('s',{keyPath:'t'});r.onsuccess=()=>ok(r.result);r.onerror=no});
async function autosave(){
  if(!sheet||!xdoc)return;
  try{
    const blob=await new Promise(r=>sheet.toBlob(r)),plist=serialize(),db=await idb(),st=db.transaction('s','readwrite').objectStore('s');
    st.put({t:Date.now(),img:blob,plist,fname});
    const k=st.getAllKeys();k.onsuccess=()=>k.result.sort((a,b)=>b-a).slice(10).forEach(x=>st.delete(x));
  }catch(e){}
}
let autoT=null;function setAuto(){clearInterval(autoT);if(cfg.auto)autoT=setInterval(autosave,cfg.auto*60000)}
setAuto();
$('bAuto').onclick=async()=>{
  let rows=[];
  try{const db=await idb();rows=await new Promise(r=>{const q=db.transaction('s').objectStore('s').getAll();q.onsuccess=()=>r(q.result)})}catch(e){}
  rows.sort((a,b)=>b.t-a.t);
  modal('<span class="x" id="mx">×</span><h3>Auto saved</h3>'+(rows.length?rows.map(r=>{const d=new Date(r.t);return'<div class="kr"><span>Auto saved work | '+d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' | '+d.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})+' |</span><button class="alt" data-t="'+r.t+'">+</button></div>'}).join(''):'<p>Nothing saved yet. Work is saved every 20 minutes.</p>'));
  $('mx').onclick=closeM;
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{
    const r=rows.find(x=>x.t==b.dataset.t);
    try{setSheet(await imgFrom(r.img));load(r.plist);fname=r.fname;closeM();refresh()}catch(e){status('Could not load that save',true);closeM()}
  });
};

if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
